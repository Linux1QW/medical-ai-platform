name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # backend-test: Python 3.10, MySQL 8, Redis 7
  # ============================================================================
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6

      # v6.0.0
      - uses: actions/setup-python@e797f83bcb1c12e7e5e580b8e22e5b8e2b8a0e2c
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run mypy type check (blocking)
        run: |
          cd backend
          python -m mypy app

      - name: Run tests with coverage
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test_db
          REDIS_CHECKPOINT_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-for-ci
          DASHSCOPE_API_KEY: test-key
          LANGGRAPH_ENABLED: 'false'
          TESTING: 'true'
          AUDIT_LOG_ENABLED: 'true'
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=40

      - name: Run RAG eval smoke test (mock mode, blocking threshold gate)
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test_db
          REDIS_CHECKPOINT_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-for-ci
          DASHSCOPE_API_KEY: test-key
          LANGGRAPH_ENABLED: 'false'
          TESTING: 'true'
        run: |
          cd backend
          python -m evaluation.rag_eval --mode mock --limit 5 --fail-on-threshold

      - name: Run Task 8 quality gate tests
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test_db
          REDIS_CHECKPOINT_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-for-ci
          DASHSCOPE_API_KEY: test-key
          LANGGRAPH_ENABLED: 'false'
          TESTING: 'true'
        run: |
          cd backend
          python -m pytest \
            tests/evaluation/test_task8_tuning.py \
            tests/evaluation/test_task8_metrics.py \
            tests/evaluation/test_task8_bm25_eval.py \
            tests/rag/test_task8_observability.py -q
          python -m pytest tests/rag -q

      - name: Validate BM25 golden set structure (PR gate)
        run: |
          cd backend
          python scripts/eval/evaluate_bm25.py --validate-golden-only

      - name: Run measured Task 8 gates when local artifacts are present
        shell: bash
        run: |
          cd backend
          if [[ -f evaluation_reports/bm25-v1.json && -n "$(find data/rag_indexes -mindepth 2 -maxdepth 2 -name manifest.json -print -quit 2>/dev/null)" ]]; then
            python scripts/eval/evaluate_bm25.py \
              --compare evaluation_reports/bm25-v1.json \
              --fail-on-regression
          else
            echo "SKIP: no measured BM25 baseline and generation artifacts in checkout"
          fi
          if [[ -f evaluation/rag_cases/rag_gold_cases.jsonl && -d data/medical_kb && -n "$(find data/rag_indexes -mindepth 2 -maxdepth 2 -name manifest.json -print -quit 2>/dev/null)" ]]; then
            python -m evaluation.rag_eval \
              --mode both \
              --split regression \
              --fail-on-threshold
          else
            echo "SKIP: no measured RAG gold cases and Chroma generation in checkout"
          fi

      - name: Upload coverage to Codecov
        if: always()
        # v5.0.0
        uses: codecov/codecov-action@b9fd48f0b4f09e4a5b1d0e2e5e4f5c3d6a8b9c0e
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============================================================================
  # frontend-test: Node 22
  # ============================================================================
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6

      # v5.0.0
      - uses: actions/setup-node@b5e8b5c6d7e8f7a8b9c0d1e2f3a4b5c6d7e8f9a0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm test

      - name: Run lint
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Check build output
        run: |
          if [ -d "frontend/dist" ]; then
            echo "Build successful: dist directory exists"
            ls -la frontend/dist/
          else
            echo "Build failed: dist directory not found"
            exit 1
          fi

  # ============================================================================
  # migration-gate: fresh DB + legacy fixture paths
  # ============================================================================
  migration-gate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6

      # v6.0.0
      - uses: actions/setup-python@e797f83bcb1c12e7e5e580b8e22e5b8e2b8a0e2c
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest --silent; do
            sleep 2
          done

      - name: Fresh DB migration test
        run: |
          cd backend
          python scripts/migrate_v11.py
          alembic check
          alembic downgrade -1
          alembic upgrade head

      - name: Legacy fixture migration test
        run: |
          # Test migration from legacy state
          cd backend
          mysql -h 127.0.0.1 -P 3306 -u root -ptest -e "DROP DATABASE IF EXISTS test_db; CREATE DATABASE test_db;"
          python scripts/migrate_v11.py
          alembic check

  # ============================================================================
  # code-quality: ruff + syntax check
  # ============================================================================
  code-quality:
    runs-on: ubuntu-latest
    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6
        with:
          fetch-depth: 0

      # v6.0.0
      - uses: actions/setup-python@e797f83bcb1c12e7e5e580b8e22e5b8e2b8a0e2c
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          pip install ruff

      - name: Run ruff
        run: |
          ruff check backend/

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git show --check --format= "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall app/ -q

  # ============================================================================
  # security-scan: pip-audit, npm audit, Trivy, Gitleaks (blocking)
  # ============================================================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6
        with:
          fetch-depth: 0

      # v6.0.0
      - uses: actions/setup-python@e797f83bcb1c12e7e5e580b8e22e5b8e2b8a0e2c
        with:
          python-version: '3.10'

      - name: pip-audit (backend dependencies)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      # v5.0.0
      - uses: actions/setup-node@b5e8b5c6d7e8f7a8b9c0d1e2f3a4b5c6d7e8f9a0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend dependencies)
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

      - name: Trivy filesystem scan
        # v0.36.0
        uses: aquasecurity/trivy-action@b6c7c4e8f7a9c8e2d5f6b8c9a0d1e2f3a4b5c6d7
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Gitleaks secret scan
        # v8.18.0
        uses: gitleaks/gitleaks-action@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================================================
  # rag-pr-gate: BM25 golden structure + mock Agent (no external costs)
  # ============================================================================
  rag-pr-gate:
    runs-on: ubuntu-latest
    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6

      # v6.0.0
      - uses: actions/setup-python@e797f83bcb1c12e7e5e580b8e22e5b8e2b8a0e2c
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate BM25 golden set structure
        run: |
          cd backend
          python scripts/eval/evaluate_bm25.py --validate-golden-only

      - name: Run RAG mock gate
        env:
          TESTING: 'true'
          LANGGRAPH_ENABLED: 'false'
        run: |
          cd backend
          python -m evaluation.rag_eval --mode mock --limit 5 --fail-on-threshold

  # ============================================================================
  # docker-build-candidate: build after all gates pass
  # ============================================================================
  docker-build-candidate:
    needs: [backend-test, frontend-test, migration-gate, code-quality, security-scan, rag-pr-gate]
    runs-on: ubuntu-latest
    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6

      - name: Set lowercase image repo
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Backend candidate image
        run: |
          docker build -t ${{ env.IMAGE_REPO }}/backend:${{ github.sha }} -f Dockerfile.backend .
          docker save ${{ env.IMAGE_REPO }}/backend:${{ github.sha }} > backend-image.tar

      - name: Build Frontend candidate image
        run: |
          docker build -t ${{ env.IMAGE_REPO }}/frontend:${{ github.sha }} -f Dockerfile.frontend .
          docker save ${{ env.IMAGE_REPO }}/frontend:${{ github.sha }} > frontend-image.tar

      - name: Generate SHA-256 manifest
        run: |
          sha256sum backend-image.tar > manifest.txt
          sha256sum frontend-image.tar >> manifest.txt

      - name: Upload candidate images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-candidate-images
          path: |
            backend-image.tar
            frontend-image.tar
            manifest.txt
          retention-days: 1

  # ============================================================================
  # compose-smoke: E2E smoke test with candidate images
  # ============================================================================
  compose-smoke:
    needs: [docker-build-candidate]
    runs-on: ubuntu-latest
    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6

      - name: Download candidate images
        uses: actions/download-artifact@v4
        with:
          name: docker-candidate-images

      - name: Load candidate images
        run: |
          docker load < backend-image.tar
          docker load < frontend-image.tar

      - name: Run compose smoke test
        run: |
          docker compose -f docker-compose.yml up -d --wait
          # Basic health check
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker compose down -v

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs
          path: |
            monitoring/logs/
          retention-days: 7

  # ============================================================================
  # image-security-scan: Trivy scan on candidate images
  # ============================================================================
  image-security-scan:
    needs: [docker-build-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Download candidate images
        uses: actions/download-artifact@v4
        with:
          name: docker-candidate-images

      - name: Load candidate images
        run: |
          docker load < backend-image.tar
          docker load < frontend-image.tar

      - name: Trivy image scan (backend)
        # v0.36.0
        uses: aquasecurity/trivy-action@b6c7c4e8f7a9c8e2d5f6b8c9a0d1e2f3a4b5c6d7
        with:
          image-ref: ${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy image scan (frontend)
        # v0.36.0
        uses: aquasecurity/trivy-action@b6c7c4e8f7a9c8e2d5f6b8c9a0d1e2f3a4b5c6d7
        with:
          image-ref: ${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ============================================================================
  # rag-measured-gate: only on master/tag/manual release
  # ============================================================================
  rag-measured-gate:
    needs: [docker-build-candidate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6

      # v6.0.0
      - uses: actions/setup-python@e797f83bcb1c12e7e5e580b8e22e5b8e2b8a0e2c
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAG measured gate
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TESTING: 'true'
        run: |
          cd backend
          if [[ -f evaluation_reports/bm25-v1.json ]]; then
            python scripts/eval/evaluate_bm25.py \
              --compare evaluation_reports/bm25-v1.json \
              --fail-on-regression \
              --policy evaluation/bm25_release_policy.json
          else
            echo "SKIP: no measured baseline available"
            exit 1
          fi

  # ============================================================================
  # publish/promote-release: only after all gates pass
  # ============================================================================
  publish-promote-release:
    needs: [compose-smoke, image-security-scan, rag-measured-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    environment: production
    steps:
      # v5.0.0
      - uses: actions/checkout@08eba0b21bd66751aebcf6b0b4c7f0c7f4e2e2b6

      - name: Set lowercase image repo
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # v4.0.0
      - uses: docker/login-action@e92390c5fb421da1463d20d0380a7e3b8f6c0d1e
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download candidate images
        uses: actions/download-artifact@v4
        with:
          name: docker-candidate-images

      - name: Load and push Backend
        run: |
          docker load < backend-image.tar
          docker tag ${{ env.IMAGE_REPO }}/backend:${{ github.sha }} ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}

      - name: Load and push Frontend
        run: |
          docker load < frontend-image.tar
          docker tag ${{ env.IMAGE_REPO }}/frontend:${{ github.sha }} ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}

      - name: Promote to latest (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag ${{ env.IMAGE_REPO }}/backend:${{ github.sha }} ghcr.io/${{ env.IMAGE_REPO }}/backend:latest
          docker push ghcr.io/${{ env.IMAGE_REPO }}/backend:latest
          docker tag ${{ env.IMAGE_REPO }}/frontend:${{ github.sha }} ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
          docker push ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
