      - name: Migrate and seed dual-load database
        env:
          ENVIRONMENT: test
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          alembic upgrade head
          E2E_ADMIN_USER=admin_v12 E2E_DOCTOR_USER=doctor_v12 E2E_PASSWORD=e2e_test_password_2026 \
            python -m tests.fixtures.seed_v12_coach_e2e

      - name: Start backend-a (port 8000)
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
          REDIS_CHECKPOINT_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: rc-test-secret-key-for-live-gate
