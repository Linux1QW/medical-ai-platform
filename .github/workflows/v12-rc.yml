          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend-a.log 2>&1 &

      - name: Start backend-b (port 8001)
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
          REDIS_CHECKPOINT_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: rc-test-secret-key-for-live-gate
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LANGGRAPH_ENABLED: 'true'
          TESTING: 'false'
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8001 > /tmp/backend-b.log 2>&1 &

      - name: Wait for both backends
        run: |
          for port in 8000 8001; do
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:$port/health/ready > /dev/null 2>&1 && break
              sleep 2
            done
          done
          curl -sf http://127.0.0.1:8000/health/ready || { echo "backend-a failed to start"; exit 1; }
          curl -sf http://127.0.0.1:8001/health/ready || { echo "backend-b failed to start"; exit 1; }
          echo "Both backend instances are healthy"

      - name: Run dual-instance load test
        env:
          V12_BACKEND_A: http://127.0.0.1:8000
          V12_BACKEND_B: http://127.0.0.1:8001
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TESTING: 'false'
        run: |
          cd backend
          python scripts/ci/v12_load_test.py

      - name: Verify load test report exists
        if: always()
        run: |
          ls -la backend/benchmark_reports/ || true
          test -f backend/benchmark_reports/v12_load_test_report.json || {
            echo "::error::Load test report was not generated"
            exit 1
          }

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-dual-load-report
          path: backend/benchmark_reports/v12_load_test_report.json
          retention-days: 90

  # ============================================================================
  # disconnect-replay: SSE disconnect and replay resilience tests
  # ============================================================================
  disconnect-replay:
    needs: [setup-services, db-migrate-seed]
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      MYSQL_USER: medical_e2e
      MYSQL_PASSWORD: e2e-medical-password
      MYSQL_DATABASE: medical_ai_e2e
      MYSQL_MIGRATION_USER: medical_e2e
      MYSQL_MIGRATION_PASSWORD: e2e-medical-password
      SECRET_KEY: e2e-test-secret-key-not-for-production
      DASHSCOPE_API_KEY: e2e-mock-key
      OBSERVABILITY_HMAC_KEY: e2e-observability-hmac-key
      COACH_HMAC_KEY: e2e-coach-hmac-key
      COACH_ENABLED: "true"
      LANGGRAPH_ENABLED: "true"

    steps:
      # v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_sha }}

      # v6.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Start isolated Compose fault environment
        run: |
          docker compose -p medical-ai-v12-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
          docker compose -p medical-ai-v12-e2e -f docker-compose.yml -f docker-compose.e2e.yml ps

      - name: Run fault recovery / disconnect-replay tests
        run: |
          python backend/scripts/ci/run_v12_fault_matrix.py \
            --project medical-ai-v12-e2e \
            --output backend/benchmark_reports/fault-matrix.json

      - name: Generate disconnect-replay report
        if: always()
        run: |
          mkdir -p backend/benchmark_reports
          DR_STATUS="${{ job.status == 'success' && 'completed' || 'failed' }}"
          cat > backend/benchmark_reports/rc_disconnect_replay_report.json <<EOF
          {
            "candidate_sha": "${{ inputs.candidate_sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "test_type": "fault_recovery_matrix",
            "status": "$DR_STATUS"
          }
          EOF

      - name: Upload disconnect-replay report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-disconnect-replay-report
          path: backend/benchmark_reports/rc_disconnect_replay_report.json
          retention-days: 90

      - name: Upload fault matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-fault-matrix-report
          path: backend/benchmark_reports/fault-matrix.json
          retention-days: 90

      - name: Tear down isolated Compose fault environment
        if: always()
        run: |
          docker compose -p medical-ai-v12-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > backend/benchmark_reports/fault-compose.log || true
          docker compose -p medical-ai-v12-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v

  # ============================================================================
  # migration-verify: verify migration integrity against candidate SHA
  # ============================================================================
  migration-verify:
    needs: [setup-services, db-migrate-seed]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_sha }}

      # v6.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -prc-test-password --silent; do
            sleep 2
          done

      - name: Fresh migration verification
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          python scripts/migrate.py
          alembic check

      - name: Downgrade and upgrade cycle
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          alembic downgrade -1
          alembic upgrade head
          alembic check

      - name: Generate migration verify report
        if: always()
        run: |
          mkdir -p backend/benchmark_reports
          FM_STATUS="${{ job.status == 'success' && 'success' || 'failed' }}"
          DU_STATUS="${{ job.status == 'success' && 'success' || 'failed' }}"
          ALEMBIC_STATUS="${{ job.status == 'success' && 'clean' || 'failed' }}"
          cat > backend/benchmark_reports/rc_migration_verify_report.json <<EOF
          {
            "candidate_sha": "${{ inputs.candidate_sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "fresh_migration": "$FM_STATUS",
            "downgrade_upgrade_cycle": "$DU_STATUS",
            "alembic_check": "$ALEMBIC_STATUS"
          }
          EOF

      - name: Upload migration verify report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-migration-verify-report
          path: backend/benchmark_reports/rc_migration_verify_report.json
          retention-days: 90

  # ============================================================================
  # evidence-manifest: aggregate all reports into signed evidence
  # ============================================================================
  evidence-manifest:
    needs: [coach-72-case-live, browser-e2e, dual-load, disconnect-replay, migration-verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      # v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Download all RC reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: reports/

      - name: List downloaded reports
        run: |
          echo "=== Downloaded RC Reports ==="
          find reports/ -type f -name "*.json" | sort

      - name: Generate signed evidence manifest
        run: |
          CANDIDATE_SHA="${{ inputs.candidate_sha }}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > "v12-rc-evidence-${CANDIDATE_SHA:0:12}.json" <<EOF
          {
            "candidate_sha": "$CANDIDATE_SHA",
            "timestamp": "$TIMESTAMP",
            "execution_mode": "live",
            "release_eligible": $([ "${{ needs['coach-72-case-live'].result }}" = "success" ] && \
              [ "${{ needs['browser-e2e'].result }}" = "success" ] && \
              [ "${{ needs['dual-load'].result }}" = "success" ] && \
              [ "${{ needs['disconnect-replay'].result }}" = "success" ] && \
              [ "${{ needs['migration-verify'].result }}" = "success" ] && echo "true" || echo "false"),
            "gates": {
              "coach-72-case-live": "${{ needs['coach-72-case-live'].result }}",
              "browser-e2e": "${{ needs['browser-e2e'].result }}",
              "dual-load": "${{ needs['dual-load'].result }}",
              "disconnect-replay": "${{ needs['disconnect-replay'].result }}",
              "migration-verify": "${{ needs['migration-verify'].result }}"
            },
            "all_passed": $([ "${{ needs['coach-72-case-live'].result }}" = "success" ] && \
              [ "${{ needs['browser-e2e'].result }}" = "success" ] && \
              [ "${{ needs['dual-load'].result }}" = "success" ] && \
              [ "${{ needs['disconnect-replay'].result }}" = "success" ] && \
              [ "${{ needs['migration-verify'].result }}" = "success" ] && echo "true" || echo "false"),
            "reports_collected": [
              "rc-services-report",
              "rc-migration-report",
              "rc-72case-live-report",
              "rc-browser-e2e-report",
              "rc-dual-load-report",
              "rc-disconnect-replay-report",
              "rc-migration-verify-report"
            ]
          }
          EOF

          sha256sum "v12-rc-evidence-${CANDIDATE_SHA:0:12}.json" > "v12-rc-evidence-${CANDIDATE_SHA:0:12}.json.sha256"

          echo "=== Evidence Manifest ==="
          cat "v12-rc-evidence-${CANDIDATE_SHA:0:12}.json"

      - name: Upload signed evidence manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v12-rc-evidence-manifest
          path: |
            v12-rc-evidence-*.json
            v12-rc-evidence-*.json.sha256
          retention-days: 365
