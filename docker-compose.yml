# ============================================
# Docker Compose - 医疗AI平台 v1.2 统一容器运行环境
# ============================================
# 使用方式:
#   生产环境: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   开发环境: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#   Staging:  docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# ============================================

name: medical-ai-platform

# ──────────────────────────────────────────
# YAML Anchors — 消除 API/Worker/Beat/Dispatcher 环境漂移
# ──────────────────────────────────────────
x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  # MySQL（业务用户，非 root）
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: ${MYSQL_USER:-medical_app}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_ai}
  # JWT
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  JWT_TOKEN_BLACKLIST_ENABLED: ${JWT_TOKEN_BLACKLIST_ENABLED:-true}
  JWT_BLACKLIST_FAIL_CLOSED: ${JWT_BLACKLIST_FAIL_CLOSED:-false}
  JWT_BLACKLIST_REDIS_URL: redis://redis-state:6379/7
  # Celery
  CELERY_BROKER_URL: redis://redis-state:6379/4
  CELERY_RESULT_BACKEND: redis://redis-state:6379/5
  # Redis（状态 / 缓存分离）
  REDIS_CHECKPOINT_URL: redis://redis-state:6379/0
  REDIS_CHECKPOINT_TTL: ${REDIS_CHECKPOINT_TTL:-86400}
  PROGRESS_REDIS_URL: redis://redis-state:6379/6
  EVALUATION_CONTROL_REDIS_URL: redis://redis-state:6379/8
  LLM_CACHE_REDIS_URL: redis://redis-cache:6379/0
  RETRIEVAL_CACHE_REDIS_URL: redis://redis-cache:6379/1
  # LangGraph
  LANGGRAPH_ENABLED: ${LANGGRAPH_ENABLED:-true}
  LANGGRAPH_SHADOW_MODE: ${LANGGRAPH_SHADOW_MODE:-false}
  # Qwen LLM
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
  QWEN_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
  QWEN_API_BASE_URL: ${QWEN_API_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-plus}
  RERANK_MODEL: ${RERANK_MODEL:-gte-rerank}
  # LLM 并发控制
  LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-10}
  LLM_SEMAPHORE_TIMEOUT: ${LLM_SEMAPHORE_TIMEOUT:-60}
  # Tool Use
  ENABLE_TOOL_USE: ${ENABLE_TOOL_USE:-true}
  TOOL_USE_MODEL: ${TOOL_USE_MODEL:-qwen-max}
  TOOL_USE_MAX_ROUNDS: ${TOOL_USE_MAX_ROUNDS:-4}
  TOOL_USE_MAX_CALLS: ${TOOL_USE_MAX_CALLS:-8}
  TOOL_USE_TIMEOUT_SECONDS: ${TOOL_USE_TIMEOUT_SECONDS:-30}
  TOOL_USE_MAX_RESULT_CHARS: ${TOOL_USE_MAX_RESULT_CHARS:-6000}
  KNOWLEDGE_TOOL_MAX_RAG_CALLS: ${KNOWLEDGE_TOOL_MAX_RAG_CALLS:-3}
  KNOWLEDGE_TOOL_MAX_MQE_CALLS: ${KNOWLEDGE_TOOL_MAX_MQE_CALLS:-2}
  KNOWLEDGE_TOOL_MAX_HYDE_CALLS: ${KNOWLEDGE_TOOL_MAX_HYDE_CALLS:-1}
  TOOL_USE_FALLBACK_TO_LEGACY: ${TOOL_USE_FALLBACK_TO_LEGACY:-true}
  # RAG
  ACTIVE_INDEX_VERSION: ${ACTIVE_INDEX_VERSION:-rag-v1}
  # CORS
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
  # 可观测性隐私策略
  OBSERVABILITY_CAPTURE_CONTENT: ${OBSERVABILITY_CAPTURE_CONTENT:-false}
  OBSERVABILITY_HMAC_KEY: ${OBSERVABILITY_HMAC_KEY:-}
  # Langfuse
  LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
  # 日志
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # 备份状态文件（只读，缺失只影响指标不阻止 readiness）
  BACKUP_STATUS_FILE: /var/run/medical-ai-backup/last_success.json
  # Coach / Voice (v1.2)
  COACH_ENABLED: ${COACH_ENABLED:-false}
  COACH_HMAC_KEY: ${COACH_HMAC_KEY:-}
  COACH_CONTEXT_TOKEN_LIMIT: ${COACH_CONTEXT_TOKEN_LIMIT:-16000}
  COACH_OUTPUT_TOKEN_LIMIT: ${COACH_OUTPUT_TOKEN_LIMIT:-250}
  COACH_HARD_TIMEOUT_SECONDS: ${COACH_HARD_TIMEOUT_SECONDS:-8}
  COACH_SSE_EVENT_TTL_SECONDS: ${COACH_SSE_EVENT_TTL_SECONDS:-3600}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  TZ: Asia/Shanghai

x-backend-volumes: &backend-volumes
  - chroma_data:/app/backend/data
  - ./data:/app/data:ro

x-migration-environment: &migration-environment
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_ai}
  MYSQL_USER: ${MYSQL_MIGRATION_USER:?MYSQL_MIGRATION_USER is required}
  MYSQL_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?MYSQL_MIGRATION_PASSWORD is required}
  MIGRATION_OPERATOR_ID: ${MIGRATION_OPERATOR_ID:-}

# ──────────────────────────────────────────
# 服务定义
# ──────────────────────────────────────────
services:

  # ── MySQL 数据库 ──────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_ai}
      MYSQL_USER: ${MYSQL_USER:-medical_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-medical_app}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - backend-net

  # ── Redis（状态）：AOM + noeviction ────────
  redis-state:
    # LangGraph RedisSaver requires RedisJSON and RediSearch on Redis < 8.
    image: redis/redis-stack-server:7.4.0-v8
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --maxmemory-policy noeviction"
    volumes:
      - redis_state_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - backend-net

  # ── Redis（缓存）：allkeys-lru ───────────
  redis-cache:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - backend-net

  # ── Alembic 迁移（一次性，不重启）──────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    command: python scripts/migrate.py
    environment: *migration-environment
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - backend-net

  # ── Backend（FastAPI API）───────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    restart: unless-stopped
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis-state:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - backend-net

  # ── Evaluation Dispatcher（Outbox 轮询 + 分发）──
  evaluation-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    command: python -m app.tasks.evaluation_dispatcher
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-state:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - backend-net

  # ── Celery Worker（异步评估任务）────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-state:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - backend-net

  # ── Celery Beat（定时任务调度，全局单实例）────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    command: celery -A app.celery_app beat --loglevel=info
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-state:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - backend-net

  # ── Frontend（Nginx 托管 React SPA）─────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    restart: unless-stopped
    environment:
      SSL_ENABLED: ${SSL_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      # SSL 证书（可选，无证书时 Nginx 自动回退 HTTP）
      - ./certs:/etc/nginx/ssl:ro
      # 维护模式开关（宿主机 .deploy/maintenance/enabled 文件触发 503）
      - ./.deploy/maintenance:/var/run/medical-ai-maintenance:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--no-check-certificate", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - frontend-net
      - backend-net

  # ── 监控（可选 profile）────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - backend-net

# ──────────────────────────────────────────
# 网络
# ──────────────────────────────────────────
networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

# ──────────────────────────────────────────
# 持久化卷
# ──────────────────────────────────────────
volumes:
  mysql_data:
  redis_state_data:
  redis_cache_data:
  chroma_data:
  prometheus_data:
  grafana_data:
