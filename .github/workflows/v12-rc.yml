name: V1.2 Release Candidate Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-character commit SHA of the release candidate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v12-rc-${{ github.ref }}
  cancel-in-progress: false

env:
  MYSQL_HOST: "127.0.0.1"
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: rc-test-password
  MYSQL_DATABASE: medical_ai_rc
  REDIS_CHECKPOINT_URL: redis://127.0.0.1:6379/0
  SECRET_KEY: rc-test-secret-key-for-live-gate
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
  LANGGRAPH_ENABLED: 'true'
  TESTING: 'false'

jobs:
  # ============================================================================
  # validate-input: reject non-SHA input
  # ============================================================================
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-SHA input
        run: |
          SHA="${{ inputs.candidate_sha }}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character commit SHA, got: '$SHA'"
            exit 1
          fi
          echo "candidate_sha is valid: $SHA"

  # ============================================================================
  # setup-services: start MySQL, Redis, backend-a, backend-b, frontend
  # Then run migrate + seed before any measurement
  # ============================================================================
  setup-services:
    needs: validate-input
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_sha }}

      # v6.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -prc-test-password --silent; do
            sleep 2
          done

      - name: Run database migration
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          python scripts/migrate.py
          alembic upgrade head

      - name: Run database seed
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          mysql -h 127.0.0.1 -P 3306 -u root -prc-test-password medical_ai_rc < ../database/seed.sql
          python scripts/seed_patients.py
          test "$(mysql -Nse "SELECT COUNT(*) FROM users" -h 127.0.0.1 -P 3306 -u root -prc-test-password medical_ai_rc)" -gt 0
          test "$(mysql -Nse "SELECT COUNT(*) FROM virtual_patients" -h 127.0.0.1 -P 3306 -u root -prc-test-password medical_ai_rc)" -gt 0

      - name: Start backend-a (port 8000)
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
          REDIS_CHECKPOINT_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: rc-test-secret-key-for-live-gate
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LANGGRAPH_ENABLED: 'true'
          TESTING: 'false'
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend-a.log 2>&1 &
          echo "backend-a PID: $!"

      - name: Start backend-b (port 8001)
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
          REDIS_CHECKPOINT_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: rc-test-secret-key-for-live-gate
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LANGGRAPH_ENABLED: 'true'
          TESTING: 'false'
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8001 > /tmp/backend-b.log 2>&1 &
          echo "backend-b PID: $!"

      - name: Wait for backends to be healthy
        run: |
          for port in 8000 8001; do
            echo "Waiting for backend on port $port..."
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:$port/health > /dev/null 2>&1; then
                echo "Backend on port $port is healthy"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::Backend on port $port did not become healthy"
                cat /tmp/backend-$( [ $port -eq 8000 ] && echo a || echo b ).log
                exit 1
              fi
              sleep 2
            done
          done

      - name: Start frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: |
          cd frontend
          nohup npx vite --host 0.0.0.0 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173 > /dev/null 2>&1; then
              echo "Frontend is healthy"
              break
            fi
            sleep 1
          done

      - name: Verify all services
        run: |
          echo "=== Service Health Check ==="
          curl -sf http://127.0.0.1:8000/health/ready && echo " backend-a: OK" || echo " backend-a: FAIL"
          curl -sf http://127.0.0.1:8001/health/ready && echo " backend-b: OK" || echo " backend-b: FAIL"
          curl -sf http://127.0.0.1:5173 > /dev/null && echo " frontend: OK" || echo " frontend: FAIL"
          redis-cli ping && echo " redis: OK" || echo " redis: FAIL"

      - name: Generate services report
        run: |
          mkdir -p backend/benchmark_reports
          SVC_STATUS="${{ job.status == 'success' && 'completed' || 'failed' }}"
          MIG_STATUS="${{ job.status == 'success' && 'completed' || 'failed' }}"
          SEED_STATUS="${{ job.status == 'success' && 'completed' || 'failed' }}"
          cat > backend/benchmark_reports/rc_services_report.json <<EOF
          {
            "candidate_sha": "${{ inputs.candidate_sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "services": {
              "mysql": "healthy",
              "redis": "healthy",
              "backend-a": "healthy",
              "backend-b": "healthy",
              "frontend": "healthy"
            },
            "migration": "$MIG_STATUS",
            "seed": "$SEED_STATUS"
          }
          EOF

      - name: Upload services report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-services-report
          path: backend/benchmark_reports/rc_services_report.json
          retention-days: 90

  # ============================================================================
  # db-migrate-seed: standalone migration + seed verification
  # ============================================================================
  db-migrate-seed:
    needs: validate-input
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_sha }}

      # v6.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -prc-test-password --silent; do
            sleep 2
          done

      - name: Run migration from scratch
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          python scripts/migrate.py
          alembic upgrade head
          alembic check

      - name: Run seed
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          mysql -h 127.0.0.1 -P 3306 -u root -prc-test-password medical_ai_rc < ../database/seed.sql
          python scripts/seed_patients.py
          test "$(mysql -Nse "SELECT COUNT(*) FROM users" -h 127.0.0.1 -P 3306 -u root -prc-test-password medical_ai_rc)" -gt 0
          test "$(mysql -Nse "SELECT COUNT(*) FROM virtual_patients" -h 127.0.0.1 -P 3306 -u root -prc-test-password medical_ai_rc)" -gt 0

      - name: Verify migration and seed
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          alembic check
          echo "Migration and seed verified for candidate_sha: ${{ inputs.candidate_sha }}"

      - name: Generate migration report
        if: always()
        run: |
          mkdir -p backend/benchmark_reports
          MIG_STATUS="${{ job.status == 'success' && 'success' || 'failed' }}"
          SEED_STATUS="${{ job.status == 'success' && 'success' || 'failed' }}"
          ALEMBIC_STATUS="${{ job.status == 'success' && 'clean' || 'failed' }}"
          cat > backend/benchmark_reports/rc_migration_report.json <<EOF
          {
            "candidate_sha": "${{ inputs.candidate_sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "migration": "$MIG_STATUS",
            "seed": "$SEED_STATUS",
            "alembic_check": "$ALEMBIC_STATUS"
          }
          EOF

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-migration-report
          path: backend/benchmark_reports/rc_migration_report.json
          retention-days: 90

  # ============================================================================
  # coach-72-case-live: real-model 72-case evaluation (no mock)
  # ============================================================================
  coach-72-case-live:
    needs: [setup-services, db-migrate-seed]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_sha }}

      # v6.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run real-model 72-case live gate
        env:
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
          REDIS_CHECKPOINT_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: rc-test-secret-key-for-live-gate
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LANGGRAPH_ENABLED: 'true'
          TESTING: 'false'
        run: |
          cd backend
          python scripts/ci/v12_coach_gate.py \
            --execution-mode live \
            --output-dir benchmark_reports \
            --candidate-sha ${{ inputs.candidate_sha }} \
            --json

      - name: Verify report exists
        if: always()
        run: |
          test -f backend/benchmark_reports/v12_coach_gate_report.json || {
            echo "::error::72-case live report was not generated"
            exit 1
          }

      - name: Upload 72-case live report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-72case-live-report
          path: backend/benchmark_reports/v12_coach_gate_report.json
          retention-days: 90

  # ============================================================================
  # browser-e2e: Playwright browser E2E (real frontend + backend)
  # ============================================================================
  browser-e2e:
    needs: [setup-services, db-migrate-seed]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # v5.0.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.candidate_sha }}

      # v6.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies and Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Migrate and seed browser E2E database
        env:
          ENVIRONMENT: test
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
        run: |
          cd backend
          alembic upgrade head
          python -m tests.fixtures.seed_production_smoke
          E2E_ADMIN_USER=admin_v12 E2E_DOCTOR_USER=doctor_v12 E2E_PASSWORD=e2e_test_password_2026 \
            python -m tests.fixtures.seed_v12_coach_e2e

      - name: Start Backend A for E2E
        env:
          ENVIRONMENT: test
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
          REDIS_CHECKPOINT_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: rc-test-secret-key-for-live-gate
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LANGGRAPH_ENABLED: 'true'
          COACH_ENABLED: 'true'
          TESTING: 'false'
          PROCESS_ID: backend-a
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend-a-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health/ready > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health/ready

      - name: Start Backend B for E2E
        env:
          ENVIRONMENT: test
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: rc-test-password
          MYSQL_DATABASE: medical_ai_rc
          REDIS_CHECKPOINT_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: rc-test-secret-key-for-live-gate
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LANGGRAPH_ENABLED: 'true'
          COACH_ENABLED: 'true'
          TESTING: 'false'
          PROCESS_ID: backend-b
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8001 > /tmp/backend-b-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/health/ready > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8001/health/ready

      - name: Start frontend for E2E
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: |
          cd frontend
          nohup npx vite --host 0.0.0.0 --port 5173 > /tmp/frontend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173 > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Run Playwright browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_BACKEND_A: http://127.0.0.1:8000
          E2E_BACKEND_B: http://127.0.0.1:8001
          E2E_ADMIN_USER: admin_v12
          E2E_DOCTOR_USER: doctor_v12
          E2E_PASSWORD: e2e_test_password_2026
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: |
          cd frontend
          npx playwright test --reporter=json

      - name: Generate browser E2E report
        if: always()
        run: |
          mkdir -p backend/benchmark_reports
          E2E_STATUS="${{ job.status == 'success' && 'completed' || 'failed' }}"
          cat > backend/benchmark_reports/rc_browser_e2e_report.json <<EOF
          {
            "candidate_sha": "${{ inputs.candidate_sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tool": "playwright",
            "browser": "chromium",
            "status": "$E2E_STATUS"
          }
          EOF

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-browser-e2e-report
          path: backend/benchmark_reports/rc_browser_e2e_report.json
          retention-days: 90

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-playwright-trace
          path: frontend/test-results/
          retention-days: 14

