# Prometheus 抓取配置（medical-ai-platform v1.1）
# 与 docker compose --profile monitoring 配套使用：
#   docker compose --profile monitoring up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # 后端 FastAPI /metrics（prometheus_client 导出）
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: medical-ai-backend
    # production/staging 必须通过 Docker secret 挂载 metrics token：
    # 1. 将 token 写入 monitoring/metrics_token（勿提交 git）
    # 2. 在 docker-compose 中挂载到 /etc/prometheus/metrics_token
    # 3. 取消以下注释
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token

  # Prometheus 自监控
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
