name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run mypy type check (blocking)
        run: |
          cd backend
          python -m mypy app

      - name: Run tests with coverage
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test_db
          REDIS_CHECKPOINT_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-for-ci
          DASHSCOPE_API_KEY: test-key
          LANGGRAPH_ENABLED: 'false'
          TESTING: 'true'
          AUDIT_LOG_ENABLED: 'true'
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=40

      - name: Run RAG eval smoke test (mock mode, blocking threshold gate)
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test_db
          REDIS_CHECKPOINT_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-for-ci
          DASHSCOPE_API_KEY: test-key
          LANGGRAPH_ENABLED: 'false'
          TESTING: 'true'
        # mock 结果与 gold 期望对齐（绿路径），阈值门不过即失败：
        # 防止评测框架/指标管道/阈值配置本身被后续改动改坏
        run: |
          cd backend
          python -m evaluation.rag_eval --mode mock --limit 5 --fail-on-threshold

      - name: Run Task 8 quality gate tests
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test_db
          REDIS_CHECKPOINT_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-for-ci
          DASHSCOPE_API_KEY: test-key
          LANGGRAPH_ENABLED: 'false'
          TESTING: 'true'
        run: |
          cd backend
          python -m pytest \
            tests/evaluation/test_task8_tuning.py \
            tests/evaluation/test_task8_metrics.py \
            tests/evaluation/test_task8_bm25_eval.py \
            tests/rag/test_task8_observability.py -q
          python -m pytest tests/rag -q

      - name: Run measured Task 8 gates when local artifacts are present
        shell: bash
        run: |
          cd backend
          if [[ -f evaluation_reports/bm25-v1.json && -n "$(find data/rag_indexes -mindepth 2 -maxdepth 2 -name manifest.json -print -quit 2>/dev/null)" ]]; then
            python scripts/eval/evaluate_bm25.py \
              --compare evaluation_reports/bm25-v1.json \
              --fail-on-regression
          else
            echo "SKIP: no measured BM25 baseline and generation artifacts in checkout"
          fi
          if [[ -f evaluation/rag_cases/rag_gold_cases.jsonl && -d data/medical_kb && -n "$(find data/rag_indexes -mindepth 2 -maxdepth 2 -name manifest.json -print -quit 2>/dev/null)" ]]; then
            python -m evaluation.rag_eval \
              --mode both \
              --split regression \
              --fail-on-threshold
          else
            echo "SKIP: no measured RAG gold cases and Chroma generation in checkout"
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Verify database migrations
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest --silent; do
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -u root -ptest < database/init.sql
          for f in database/migrate_v*.sql; do
            echo "Applying $f..."
            mysql -h 127.0.0.1 -P 3306 -u root -ptest medical_ai < "$f" || echo "Warning: $f had issues"
          done

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run lint
          npm run build

      - name: Check build output
        run: |
          if [ -d "frontend/dist" ]; then
            echo "Build successful: dist directory exists"
            ls -la frontend/dist/
          else
            echo "Build failed: dist directory not found"
            exit 1
          fi

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          pip install ruff

      - name: Run ruff
        run: |
          ruff check backend/

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi

      # mypy 阻断门禁已移至 backend-test 作业（需完整依赖环境，与本地结果一致）

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall app/ -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # 安全扫描当前为告警模式（continue-on-error），存量漏洞清零后再改为阻断
      - name: pip-audit (backend dependencies)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend dependencies)
        continue-on-error: true
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set lowercase image repo
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          target: production
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          target: production
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
