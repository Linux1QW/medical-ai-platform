[project]
name = "medical-ai-platform"
version = "1.0.0"
description = "基于多智能体的医生临床问诊评估平台"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90"]
# E501 行长度由 black 控制；B008 为 FastAPI Depends()/Query() 默认参数惯用法误报
ignore = ["E501", "B008"]

[tool.ruff.lint.mccabe]
# 圈复杂度上限；存量超标函数已逐个 noqa 标记，新代码不得超过
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
