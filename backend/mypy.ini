[mypy]
python_version = 3.10
; Gradual typing baseline: keep app/ at zero errors, tighten incrementally
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = False
; Only check application code (tests/scripts excluded)
exclude = (?x)(
    ^tests/
    | ^scripts/
    | ^venv/
  )
